services:
  linkedin-mcp:
    image: stickerdaniel/linkedin-mcp-server:latest
    command: >
      --transport streamable-http --host 0.0.0.0 --port 3000 --path /mcp
    volumes:
      - ${LINKEDIN_MCP_DATA:-~/.linkedin-mcp}:/home/pwuser/.linkedin-mcp
    environment:
      TOOL_TIMEOUT: "300"
    ports:
      - "3000:3000"
    shm_size: "2gb"
    security_opt:
      - seccomp:unconfined

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATA_DIR: /app/data
      MCP_BASE_URL: ${MCP_BASE_URL:-http://linkedin-mcp:3000/mcp}
      MOCK_MCP: ${MOCK_MCP:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LOG_LEVEL: info
    depends_on:
      linkedin-mcp:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_started
